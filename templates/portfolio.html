<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Barbearia Imperial - Portfólio</title>
    <style>
        body { background-color: #0F0F0F; color: #F5F5F5; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        h1 { color: #D4AF37; }
        nav { margin-bottom: 25px; text-align: center; }
        nav a { color: #D4AF37; margin: 0 15px; text-decoration: none; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1A1A1A; border: 1px solid #333; padding: 15px; border-radius: 8px; }
        .card img { width: 100%; border-radius: 6px; height: 200px; object-fit: cover; }
        select { padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav>
        <a href="/">📅 Agendamento</a>
        <a href="/portfolio/">💈 Portfólio</a>
        <a href="/painel/">🔐 Painel do Barbeiro</a>
    </nav>

    <h1>💈 Portfólio de Cortes</h1>

    <form method="GET">
        <label>Filtrar por Barbeiro:</label>
        <select name="barbeiro_id" onchange="this.form.submit()">
            <option value="todos">Todos os Barbeiros</option>
            {% for b in barbeiros %}
                <option value="{{ b.id }}" {% if barbeiro_selecionado == b.id|stringformat:"s" %}selected{% endif %}>{{ b.nome }}</option>
            {% endfor %}
        </select>
    </form>

    <div class="grid">
        {% for c in cortes %}
            <div class="card">
                <img src="{{ c.foto_corte_url }}" alt="Foto do Corte">
                <p><strong>Barbeiro:</strong> {{ c.barbeiros.nome }}</p>
                <p><strong>Serviço:</strong> {{ c.servicos.nome }}</p>
                <small>Data: {{ c.data_agendamento }}</small>
            </div>
        {% empty %}
            <p>Nenhum corte publicado no portfólio até o momento.</p>
        {% endfor %}
    </div>
</body>
</html>
