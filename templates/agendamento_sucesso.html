<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agendamento Confirmado!</title>
    <style>
        body { background-color: #0F0F0F; color: #F5F5F5; font-family: sans-serif; text-align: center; padding: 50px; }
        .card { background: #1A1A1A; border: 1px solid #D4AF37; padding: 30px; border-radius: 12px; display: inline-block; }
        h1 { color: #D4AF37; }
        a { color: #D4AF37; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 Agendamento Confirmado!</h1>
        <p>Obrigado, <strong>{{ nome }}</strong>!</p>
        <p>Seu horário está reservado para o dia <strong>{{ data }}</strong> às <strong>{{ horario }}</strong>.</p>
        <br>
        <a href="/">Voltar ao Início</a>
    </div>
</body>
</html>
